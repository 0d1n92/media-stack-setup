server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Login unico per tutto il sito (dashboard + servizi proxati). Plex resta
    # escluso: non passa da qui, usa il suo account plex.tv sulla porta 32400.
    auth_basic "Media Server";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location /radarr/ {
        proxy_pass http://radarr:7878/radarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sonarr/ {
        proxy_pass http://sonarr:8989/sonarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /prowlarr/ {
        proxy_pass http://prowlarr:9696/prowlarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bazarr/ {
        proxy_pass http://bazarr:6767/bazarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lidarr/ {
        proxy_pass http://lidarr:8686/lidarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /qbittorrent/ {
        proxy_pass http://qbittorrent:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Referer $scheme://$host/;
    }

    location /files/ {
        client_max_body_size 0;   # upload di file grandi senza limiti
        proxy_pass http://filebrowser:80/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
