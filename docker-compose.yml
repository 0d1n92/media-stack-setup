networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24   # fissa cosi' qBittorrent puo' whitelistare il reverse proxy nginx

services:
  dashboard:
    image: nginx:alpine
    container_name: dashboard
    ports:
      - "80:80"
    volumes:
      - /opt/mediaserver/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/mediaserver/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/mediaserver/dashboard:/usr/share/nginx/html:ro
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    command: ["--noauth", "--baseURL", "/files"]   # login unico gia' garantito da nginx davanti
    environment:
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/filebrowser:/database
      - /mnt/media:/srv/media
      - /:/srv/os:ro   # disco di sistema, sola lettura per sicurezza
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    devices:
      - /dev/dri:/dev/dri   # GPU Intel Quick Sync per il transcoding hardware
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - /opt/mediaserver/data/docker/plex:/config
      - /mnt/media/movies:/movies
      - /mnt/media/tv:/tv
    tmpfs:
      - /transcode:size=2g   # file temporanei di transcoding in RAM, niente scrittura sull'SSD
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /opt/mediaserver/data/docker/qbittorrent:/config
      - /opt/mediaserver/data/torrents/incomplete:/data/incomplete
      - /mnt/media:/data/media
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    profiles: ["arr"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/radarr:/config
      - /mnt/media:/data/media
    ports:
      - "7878:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    profiles: ["arr"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    profiles: ["arr"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/sonarr:/config
      - /mnt/media:/data/media
    ports:
      - "8989:8989"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    profiles: ["arr"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/bazarr:/config
      - /mnt/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    profiles: ["arr"]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /opt/mediaserver/data/docker/overseerr:/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    # Niente blocco nginx /overseerr/: a differenza di Radarr/Sonarr/Prowlarr/Bazarr,
    # Overseerr non supporta un sub-path dietro reverse proxy (asset Next.js con
    # percorsi assoluti), va sulla sua porta diretta come Plex. Il primo accesso
    # richiede il wizard di setup via browser (login con l'account Plex).

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    profiles: ["arr"]
    shm_size: 2gb
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped
